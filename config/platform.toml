# The committed engine config (spec section 3 defaults, paper mode only).
# Data (ledger, recordings, cache, risk state) lives OUTSIDE the checkout, in ../copytrade-data/ next to it.
mode = "paper"

[storage]
ledger_dir = "../copytrade-data/ledger"
recordings_dir = "../copytrade-data/recordings"

[clock]
offset_interval_s = 600
max_offset_uncertainty_ms = 100
max_estimate_age_s = 1800

[supervisor]
restart_delay_s = 30
max_restarts_per_hour = 5

[live]
min_wallet_usd = 300.0

[latency]
measure_hours = 24
min_signals = 100
